    function escapeHtml(value) {

      return String(value)
        .replaceAll(
          "&",
          "&amp;"
        )
        .replaceAll(
          "<",
          "&lt;"
        )
        .replaceAll(
          ">",
          "&gt;"
        )
        .replaceAll(
          '"',
          "&quot;"
        )
        .replaceAll(

                  <span
                    class="song-play"
                  >
                    ▶
                  </span>

                </button>

              `;

            }
          )
          .join("");

    }


    /* ================================
       UPDATE INFO
    ================================= */

    function updateSongInfo(index) {

      const song =
        songs[index];


      songName.textContent =
        song.title;


      artist.textContent =
        song.artist;


      source.textContent =
        "YouTube · Garba Pandal";


      renderPlaylist();

    }


    /* ================================
       LOAD SONG
    ================================= */

    function loadSong(
      index,
      shouldPlay
    ) {

      if (!playerReady) {

        status.textContent =
          "YouTube player is still loading…";

        return;
      }


      const song =
        songs[index];


      activeIndex =
        index;


      updateSongInfo(index);


      status.classList.remove(
        "error"
      );


      status.textContent =
        "Loading " +
        song.title +
        "…";


      try {

        /*
          SAME EXISTING YOUTUBE IFRAME

          No redirect.
          No new tab.
          No YouTube search.

          Only the video inside iframe changes.
        */

        player.loadVideoById(
          song.id
        );


        if (shouldPlay) {

          userStarted =
            true;

          player.playVideo();

        }

      } catch (error) {

        console.error(error);

        status.textContent =
          "Could not load this Garba.";

        status.classList.add(
          "error"
        );

      }

    }


    /* ================================
       SONG CLICK
    ================================= */

    songList.addEventListener(
      "click",
      function (event) {

        const button =
          event.target.closest(
            ".song-item"
          );


        if (!button) {
          return;
        }


        const index =
          Number(
            button.dataset.index
          );


        /*
          If music is already playing,
          switch and start immediately.

          If not, simply load it.
        */

        const shouldPlay =
          userStarted;


        loadSong(
          index,
          shouldPlay
        );

      }
    );


    /* ================================
       TABS
    ================================= */

    document
      .querySelectorAll(".tab")
      .forEach(
        function (tab) {

          tab.addEventListener(
            "click",
            function () {

              document
                .querySelectorAll(".tab")
                .forEach(
                  function (button) {

                    button.classList.remove(
                      "active"
                    );

                  }
                );


              tab.classList.add(
                "active"
              );


              activeFilter =
                tab.dataset.filter;


              renderPlaylist();

            }
          );

        }
      );


    /* ================================
       YOUTUBE API
    ================================= */

    const youtubeScript =
      document.createElement(
        "script"
      );


    youtubeScript.src =
      "https://www.youtube.com/iframe_api";


    youtubeScript.async =
      true;


    document.head.appendChild(
      youtubeScript
    );


    window.onYouTubeIframeAPIReady =
      function () {

        player =
          new YT.Player(
            "youtube-player",
            {

              videoId:
                songs[0].id,

              width:
                "100%",

              height:
                "100%",

              playerVars: {

                autoplay:
                  0,

                controls:
                  1,

                playsinline:
                  1,

                enablejsapi:
                  1,

                fs:
                  1,

                rel:
                  0,

                iv_load_policy:
                  3,

                origin:
                  SITE_ORIGIN

              },

              events: {

                onReady:
                  onPlayerReady,

                onStateChange:
                  onPlayerStateChange,

                onError:
                  onPlayerError,

                onAutoplayBlocked:
                  onAutoplayBlocked

              }

            }
          );

      };


    /* ================================
       PLAYER READY
    ================================= */

    function onPlayerReady() {

      playerReady =
        true;


      enterButton.disabled =
        false;


      status.textContent =
        "Ready — press Enter the Pandal.";


      renderPlaylist();

    }


    /* ================================
       PLAYER STATE
    ================================= */

    function onPlayerStateChange(
      event
    ) {

      if (
        event.data ===
        YT.PlayerState.PLAYING
      ) {

        userStarted =
          true;


        enterButton.textContent =
          "❚❚  PANDAL IS LIVE";


        status.textContent =
          "Garba is playing live.";


        return;
      }


      if (
        event.data ===
        YT.PlayerState.PAUSED
      ) {

        enterButton.textContent =
          "▶  RESUME PANDAL";


        status.textContent =
          "Paused.";


        return;
      }


      if (
        event.data ===
        YT.PlayerState.BUFFERING
      ) {

        status.textContent =
          "Buffering Garba…";


        return;
      }


      if (
        event.data ===
        YT.PlayerState.ENDED
      ) {

        /*
          Loop the current Garba.
        */

        if (userStarted) {

          player.seekTo(
            0,
            true
          );


          player.playVideo();

        }

      }

    }


    /* ================================
       ENTER THE PANDAL
    ================================= */

    enterButton.addEventListener(
      "click",
      function () {

        if (!playerReady) {

          status.textContent =
            "YouTube player is still loading…";

          return;
        }


        userStarted =
          true;


        status.classList.remove(
          "error"
        );


        try {

          const state =
            player.getPlayerState();


          if (
            state ===
            YT.PlayerState.PLAYING
          ) {

            player.pauseVideo();

          } else {

            player.playVideo();

          }

        } catch (error) {

          console.error(error);

          status.textContent =
            "Press Play inside the YouTube player.";

          status.classList.add(
            "error"
          );

        }

      }
    );


    /* ================================
       AUTOPLAY BLOCKED
    ================================= */

    function onAutoplayBlocked() {

      status.textContent =
        "Browser blocked scripted playback. Press Play inside YouTube.";

      status.classList.add(
        "error"
      );


      enterButton.textContent =
        "▶  PLAY INSIDE PLAYER";
    }


    /* ================================
       YOUTUBE ERROR
    ================================= */

    function onPlayerError(
      event
    ) {

      console.error(
        "YouTube player error:",
        event.data
      );


      if (
        event.data === 101
        ||
        event.data === 150
      ) {

        status.textContent =
          "This video does not allow website embedding.";

      }

      else if (
        event.data === 100
      ) {

        status.textContent =
          "This video is unavailable or removed.";

      }

      else if (
        event.data === 153
      ) {

        status.textContent =
          "YouTube could not verify the website origin.";

      }

      else {

        status.textContent =
          "YouTube could not play this video.";

      }


      status.classList.add(
        "error"
      );
    }


    /* ================================
       SPACEBAR
    ================================= */

    document.addEventListener(
      "keydown",
      function (event) {

        if (
          event.code === "Space"
          &&
          playerReady
        ) {

          event.preventDefault();


          const state =
            player.getPlayerState();


          if (
            state ===
            YT.PlayerState.PLAYING
          ) {

            player.pauseVideo();

          } else {

            userStarted =
              true;

            player.playVideo();

          }

        }

      }
    );


    /* ================================
       INITIAL RENDER
    ================================= */

    renderPlaylist();

  </script>

</body>
</html>

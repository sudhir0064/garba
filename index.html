<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garba Pandal | Pure Aesthetic Vibe</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #3a0007; height: 100vh; width: 100vw; display: flex; flex-direction: column; justify-content: space-between; align-items: center; overflow: hidden; padding: 40px 20px; }
        .top-bar { display: flex; justify-content: center; align-items: center; width: 100%; position: absolute; top: 30px; z-index: 5; }
        .live-counter { background: rgba(255, 255, 255, 0.1); color: #ffffff; padding: 8px 18px; border-radius: 30px; font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; gap: 10px; border: 1px solid rgba(255, 255, 255, 0.2); }
        .live-dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; box-shadow: 0 0 12px #10b981; animation: pulse 2s infinite; }
        .center-branding { margin: auto; text-align: center; z-index: 2; }
        .main-title { font-size: clamp(4rem, 10vw, 7.5rem); font-weight: 900; color: #ffffff; line-height: 1.1; letter-spacing: 4px; text-shadow: 0 15px 35px rgba(0, 0, 0, 0.8); }
        .subtitle { font-size: clamp(0.85rem, 1.8vw, 1.1rem); color: #ffd700; font-weight: 700; text-transform: uppercase; letter-spacing: 6px; margin-top: 20px; }
        .premium-player { background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 40px; width: 100%; max-width: 540px; padding: 22px 28px; display: flex; align-items: center; justify-content: space-between; gap: 20px; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75); margin-bottom: 10px; z-index: 10; }
        .disc-art { width: 58px; height: 58px; border-radius: 50%; background: linear-gradient(135deg, #ff3d00, #ffae00); display: flex; justify-content: center; align-items: center; font-size: 1.8rem; cursor: pointer; }
        .rotate { animation: spin 5s linear infinite; }
        .track-details { flex-grow: 1; overflow: hidden; text-align: left; }
        .song-name { font-size: 1.05rem; font-weight: 600; color: #ffffff; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .artist-name { font-size: 0.82rem; color: #a0a0a0; }
        .btn-main-play { background: #ffffff; color: #000000; width: 46px; height: 46px; border-radius: 50%; font-size: 1.1rem; display: flex; justify-content: center; align-items: center; cursor: pointer; border: none; }
        #yt-hidden-player { position: absolute; top: -9999px; left: -9999px; width: 1px; height: 1px; visibility: hidden; }
        @keyframes pulse { 0% { transform: scale(0.9); opacity: 0.6; } 50% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(0.9); opacity: 0.6; } }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
    <!-- YouTube Player API Script -->
    <script src="https://youtube.com"></script>
</head>
<body>

    <div class="top-bar">
        <div class="live-counter"><span class="live-dot"></span><span id="liveCount">3,450</span> khelaiyas in pandal</div>
    </div>

    <div class="center-branding">
        <h1 class="main-title">गरबा<br>पंडाल</h1>
        <div class="subtitle">United Way Vibe Loop</div>
    </div>

    <div class="premium-player">
        <div class="disc-art" id="clapBtn">🥁</div>
        <div class="track-details">
            <div class="song-name" id="songTitle">Loading Pandal Loop...</div>
            <div class="artist-name" id="artistTitle">Taalis: 0</div>
        </div>
        <button class="btn-main-play" id="playBtn">▶</button>
    </div>

    <!-- Hidden YouTube iframe container -->
    <div id="yt-hidden-player"></div>
    
    <!-- Local Instant Clap Sound Effect -->
    <audio id="clapSound" src="https://mixkit.co"></audio>

    <script>
        // High Quality Navratri Playlist directly from YouTube IDs
        const playlist = [
            { title: "Tara Vina Shyam - Nonstop", artist: "Atul Purohit Live Vadodara", id: "5gE6f_uVzT0" },
            { title: "Navratri Non-Stop Garba Hits", artist: "Falguni Pathak Fusion Mix", id: "6w_v20OmslM" },
            { title: "Sanedo & Titodo Non-Stop", artist: "Traditional Folk Dhol Beats", id: "V6X80qVb8S4" }
        ];

        let currentIndex = 0;
        let claps = 0;
        let player;
        let isPlayerReady = false;

        const clapSound = document.getElementById('clapSound');
        const playBtn = document.getElementById('playBtn');
        const clapBtn = document.getElementById('clapBtn');
        const songTitle = document.getElementById('songTitle');
        const artistTitle = document.getElementById('artistTitle');
        const liveCount = document.getElementById('liveCount');

        // Initialize YouTube Hidden Player
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-hidden-player', {
                height: '1',
                width: '1',
                videoId: playlist[currentIndex].id,
                playerVars: {
                    'autoplay': 0,
                    'controls': 0,
                    'disablekb': 1,
                    'fs': 0,
                    'rel': 0,
                    'modestbranding': 1,
                    'loop': 1,
                    'playlist': playlist[currentIndex].id
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            isPlayerReady = true;
            songTitle.textContent = playlist[currentIndex].title;
            updateArtistText();
        }

        function updateArtistText() {
            artistTitle.textContent = `${playlist[currentIndex].artist} | Taalis: ${claps}`;
        }

        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.PLAYING) {
                playBtn.textContent = "⏸";
                clapBtn.classList.add('rotate');
            } else {
                playBtn.textContent = "▶";
                clapBtn.classList.remove('rotate');
            }
        }

        function togglePlay() {
            if (!isPlayerReady) return;
            const state = player.getPlayerState();
            if (state == YT.PlayerState.PLAYING) {
                player.pauseVideo();
            } else {
                player.playVideo();
            }
        }

        playBtn.addEventListener('click', togglePlay);

        // Click on Drum triggers Taali SFX and plays YouTube video
        clapBtn.addEventListener('click', () => {
            if (isPlayerReady && player.getPlayerState() != YT.PlayerState.PLAYING) {
                player.playVideo();
            }
            
            // Play physical clap sound instantly
            clapSound.currentTime = 0;
            clapSound.play().catch(e => {});

            claps++;
            updateArtistText();
        });

        // Simulated online visitors shift
        setInterval(() => {
            let active = parseInt(liveCount.textContent.replace(',', ''));
            liveCount.textContent = (active + Math.floor(Math.random() * 5) - 2).toLocaleString();
        }, 3000);
    </script>
</body>
</html>

html,body{width:100%;height:100%}
body{min-height:100vh;overflow:hidden;background:#3a0007;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}

.page{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 42%,rgba(120,0,18,.2),transparent 45%),
    #3a0007
}

.topbar{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  padding:42px 11vw 0;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  z-index:40
}

.clock-box{
  display:flex;
  flex-direction:column;
  gap:7px
}

.clock{
  font-size:16px;
  font-weight:500;
  letter-spacing:-.02em;
  opacity:.85
}

.festival{
  font-size:11px;
  font-weight:700;
  color:#ffd900;
  letter-spacing:.04em
}

.listeners{
  display:flex;
  align-items:center;
  gap:9px;
  padding:8px 14px;
  border-radius:30px;
  background:rgba(255,255,255,.08);
  font-size:12px;
  font-weight:600
}

.listener-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#19d58a;
  box-shadow:0 0 10px rgba(25,213,138,.8)
}

.hero{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding-bottom:280px;
  text-align:center
}

.title{
  font-size:clamp(70px,9vw,135px);
  line-height:.9;
  font-weight:800;
  letter-spacing:-.07em
}

.subtitle{
  margin-top:35px;
  font-size:15px;
  font-weight:800;
  letter-spacing:.26em;
  color:#ffd900
}

.player-card{
  position:absolute;
  left:50%;
  bottom:28px;
  transform:translateX(-50%);
  width:min(1120px,calc(100vw - 36px));
  min-height:245px;
  display:grid;
  grid-template-columns:320px minmax(280px,1fr) 360px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.09);
  border-radius:22px;
  background:rgba(19,19,19,.98);
  box-shadow:0 25px 75px rgba(0,0,0,.42);
  z-index:30
}

.youtube-wrap{
  position:relative;
  min-height:245px;
  background:#080808;
  overflow:hidden
}

#youtube-player{
  position:absolute;
  inset:0;
  width:100%;
  height:100%
}

.info{
  padding:26px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  border-left:1px solid rgba(255,255,255,.05)
}

.now-playing{
  font-size:9px;
  font-weight:700;
  letter-spacing:.2em;
  color:rgba(255,255,255,.36)
}

.song-name{
  margin-top:10px;
  font-size:23px;
  line-height:1.15;
  font-weight:750;
  letter-spacing:-.025em
}

.artist{
  margin-top:7px;
  font-size:12px;
  color:rgba(255,255,255,.48)
}

.source{
  margin-top:5px;
  font-size:9px;
  color:rgba(255,255,255,.27)
}

.status{
  margin-top:10px;
  min-height:28px;
  font-size:9px;
  line-height:1.45;
  color:rgba(255,255,255,.3)
}

.status.error{
  color:#ff8f8f
}

.controls{
  display:flex;
  gap:8px;
  align-items:center;
  margin-bottom:9px
}

.control{
  border:1px solid rgba(255,255,255,.09);
  background:rgba(255,255,255,.05);
  color:#fff;
  border-radius:12px;
  min-height:42px;
  padding:0 12px;
  font-size:10px;
  font-weight:700;
  cursor:pointer
}

.control:hover{
  background:rgba(255,255,255,.09)
}

.control.primary{
  background:#fff;
  color:#3a0007;
  border-color:#fff;
  flex:1
}

.control.ramzat.active{
  background:#ffd900;
  color:#3a0007;
  border-color:#ffd900
}

.playlist{
  min-width:0;
  padding:17px;
  display:flex;
  flex-direction:column;
  border-left:1px solid rgba(255,255,255,.05);
  background:rgba(255,255,255,.025)
}

.playlist-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px
}

.playlist-title{
  font-size:9px;
  font-weight:800;
  letter-spacing:.18em;
  color:rgba(255,255,255,.48)
}

.live-label{
  font-size:8px;
  color:#19d58a;
  opacity:.8
}

.song-list{
  overflow:auto;
  padding-right:3px;
  min-height:0;
  max-height:207px
}

.song-list::-webkit-scrollbar{
  width:3px
}

.song-list::-webkit-scrollbar-thumb{
  background:rgba(255,255,255,.16);
  border-radius:20px
}

.song-item{
  width:100%;
  display:flex;
  align-items:center;
  gap:8px;
  padding:7px;
  margin-bottom:2px;
  border:1px solid transparent;
  border-radius:9px;
  background:transparent;
  color:#fff;
  text-align:left;
  cursor:pointer
}

.song-item:hover{
  background:rgba(255,255,255,.055)
}

.song-item.active{
  background:rgba(255,255,255,.09);
  border-color:rgba(255,255,255,.07)
}

.song-number{
  width:22px;
  flex:0 0 22px;
  font-size:8px;
  color:rgba(255,255,255,.24)
}

.song-info{
  flex:1;
  min-width:0
}

.song-title{
  display:block;
  font-size:9px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.song-artist{
  display:block;
  margin-top:2px;
  font-size:7px;
  color:rgba(255,255,255,.3);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.song-play{
  font-size:7px;
  color:#ffd900;
  width:14px;
  text-align:center
}

@media(max-width:1080px){
  .player-card{
    grid-template-columns:300px 1fr
  }

  .playlist{
    grid-column:1/-1;
    border-left:none;
    border-top:1px solid rgba(255,255,255,.05)
  }

  .song-list{
    max-height:120px
  }
}

@media(max-width:700px){
  body{
    overflow:auto
  }

  .page{
    height:auto;

  .topbar{

  .clock{
    font-size:14px
  }

  .festival{
    font-size:9px
  }

  .listeners{
    font-size:10px;
    padding:7px 10px
  }

  .hero{
    position:relative;
    min-height:100vh;
    padding:120px 18px 720px
  }

  .title{
    font-size:64px
  }

  .subtitle{
    font-size:9px;
    margin-top:24px
  }

  .player-card{
    bottom:12px;
    width:calc(100vw - 20px);
    grid-template-columns:1fr;
    border-radius:18px
  }

  .youtube-wrap{
    min-height:210px
  }

  #youtube-player{
    min-height:210px
  }

  .info{
    min-height:180px;
    padding:18px;
    border-left:none;
    border-top:1px solid rgba(255,255,255,.05)
  }

  .playlist{
    border-left:none;
    border-top:1px solid rgba(255,255,255,.05);
    max-height:260px
  }

  .song-list{
    max-height:160px
  }

  .song-name{
    font-size:18px
  }
}

let player = null;
let playerReady = false;
let userStarted = false;
let activeIndex = 0;
let ramzat = false;
let timer = null;
let switching = false;

const clock =
  document.getElementById("clock");

const listeners =
  document.getElementById("listeners");

const songName =
  document.getElementById("songName");

const artist =
  document.getElementById("artist");

const status =
  document.getElementById("status");

const songList =
  document.getElementById("songList");

const mainButton =
  document.getElementById("mainButton");

const prevButton =
  document.getElementById("prevButton");

const nextButton =
  document.getElementById("nextButton");

const ramzatButton =
  document.getElementById("ramzatButton");


/* CLOCK */

function updateClock(){

  const now =
    new Date();

  clock.textContent =
    now.toLocaleTimeString(
      "en-IN",
      {
        hour:"numeric",
        minute:"2-digit"
      }
    );
}

updateClock();

setInterval(
  updateClock,
  1000
);


/* LIVE COUNTER */

let listenerCount =
  1084;

setInterval(
  function(){

    const d =
      Math.floor(
        Math.random()*4
      );

    listenerCount +=
      Math.random() > .5
        ? d
        : -d;

    listenerCount =
      Math.max(
        1000,
        listenerCount
      );

    listeners.textContent =
      listenerCount.toLocaleString(
        "en-IN"
      )
      +
      " listening";

  },
  7000
);


/* PLAYLIST */

function renderPlaylist(){

  songList.innerHTML =
    songs
      .map(
        function(
          s,
          i
        ){

          return `
            <button
              class="song-item${i === activeIndex ? " active" : ""}"
              data-index="${i}"
              type="button"
            >

              <span
                class="song-number"
              >
                ${String(i+1).padStart(2,"0")}
              </span>

              <span
                class="song-info"
              >

                <span
                  class="song-title"
                >
                  ${escapeHtml(s.title)}
                </span>

                <span
                  class="song-artist"
                >
                  ${escapeHtml(s.artist)}
                </span>

              </span>

              <span
                class="song-play"
              >
                ${i === activeIndex ? "▮▮▮" : "▶"}
              </span>

            </button>
          `;

        }
      )
      .join("");

}


/* ESCAPE */

function escapeHtml(value){

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* UPDATE INFO */

function setInfo(index){

  const song =
    songs[index];

  songName.textContent =
    song.title;

  artist.textContent =
    song.artist;

  renderPlaylist();

}


/* TIMER */

function clearTimer(){

  if(timer){

    clearInterval(
      timer
    );

    timer =
      null;
  }

}


function startSegmentWatch(){

  clearTimer();

  const song =
    songs[activeIndex];

  if(
    !song.segment ||
    !song.end
  ){

    return;
  }


  timer =
    setInterval(
      function(){

        if(
          !playerReady ||
          switching ||
          player.getPlayerState() !==
            YT.PlayerState.PLAYING
        ){

          return;
        }


        const current =
          player.getCurrentTime();


        if(
          current >=
          song.end - .35
        ){

          nextTrack();

        }

      },
      200
    );

}


/* LOAD */

function loadTrack(
  index,
  play
){

  if(
    !playerReady
  ){

    return;
  }


  clearTimer();

  switching =
    true;


  activeIndex =
    (
      (
        index %
        songs.length
      )
      +
      songs.length
    )
    %
    songs.length;


  const song =
    songs[activeIndex];


  setInfo(
    activeIndex
  );


  status.classList.remove(
    "error"
  );


  status.textContent =
    "Loading "
    +
    song.title
    +
    "…";


  try{

    if(
      song.segment
    ){

      player.loadVideoById({

        videoId:
          song.videoId,

        startSeconds:
          song.start,

        endSeconds:
          song.end

      });

    }

    else{

      player.loadVideoById(
        song.videoId
      );

    }


    if(play){

      userStarted =
        true;

      setTimeout(
        function(){

          try{

            player.playVideo();

          }
          catch(e){}

        },
        120
      );

    }

  }

  catch(error){

    status.textContent =
      "Could not load this Garba.";

    status.classList.add(
      "error"
    );

  }


  setTimeout(
    function(){

      switching =
        false;

      startSegmentWatch();

    },
    500
  );

}


/* NEXT */

function nextTrack(){

  if(
    switching
  ){

    return;
  }


  if(
    ramzat
  ){

    let next;


    do{

      next =
        Math.floor(
          Math.random()
          *
          songs.length
        );

    }
    while(
      songs.length > 1 &&
      next === activeIndex
    );


    loadTrack(
      next,
      true
    );

  }

  else{

    loadTrack(
      (
        activeIndex + 1
      )
      %
      songs.length,
      true
    );

  }

}


/* PREVIOUS */

function previousTrack(){

  if(
    switching
  ){

    return;
  }


  loadTrack(
    (
      activeIndex - 1 +
      songs.length
    )
    %
    songs.length,

    userStarted
  );

}


/* MAIN BUTTON */

mainButton.addEventListener(
  "click",
  function(){

    if(
      !playerReady
    ){

      return;
    }


    try{

      if(
        player.getPlayerState()
        ===
        YT.PlayerState.PLAYING
      ){

        player.pauseVideo();

      }

      else{

        userStarted =
          true;

        player.playVideo();

      }

    }

    catch(error){}

  }
);


/* PREVIOUS */

prevButton.addEventListener(
  "click",
  previousTrack
);


/* NEXT */

nextButton.addEventListener(
  "click",
  function(){

    userStarted =
      true;

    nextTrack();

  }
);


/* RAMZAT */

ramzatButton.addEventListener(
  "click",
  function(){

    ramzat =
      !ramzat;


    ramzatButton.classList.toggle(
      "active",
      ramzat
    );


    ramzatButton.textContent =
      ramzat
        ? "🪘 RAMZAT ON"
        : "🪘 RAMZAT";


    if(
      ramzat &&
      playerReady
    ){

      userStarted =
        true;

      nextTrack();

    }

  }
);


/* SONG CLICK */

songList.addEventListener(
  "click",
  function(event){

    const button =
      event.target.closest(
        ".song-item"
      );


    if(
      !button
    ){

      return;

    }


    loadTrack(
      Number(
        button.dataset.index
      ),

      userStarted
    );

  }
);


/* SPACEBAR */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.code === "Space" &&
      playerReady
    ){

      event.preventDefault();


      if(
        player.getPlayerState()
        ===
        YT.PlayerState.PLAYING
      ){

        player.pauseVideo();

      }

      else{

        userStarted =
          true;

        player.playVideo();

      }

    }

  }
);


/* YOUTUBE API */

const youtubeScript =
  document.createElement(
    "script"
  );


youtubeScript.src =
  "https://www.youtube.com/iframe_api";


youtubeScript.async =
  true;


document.head.appendChild(
  youtubeScript
);


/* API READY */

window.onYouTubeIframeAPIReady =
  function(){

    const first =
      songs[0];


    player =
      new YT.Player(
        "youtube-player",
        {

          videoId:
            first.videoId,

          width:
            "100%",

          height:
            "100%",

          playerVars:{

            autoplay:
              0,

            controls:
              1,

            playsinline:
              1,

            enablejsapi:
              1,

            fs:
              1,

            rel:
              0,

            iv_load_policy:
              3,

            origin:
              SITE_ORIGIN

          },

          events:{

            onReady:
              onPlayerReady,

            onStateChange:
              onStateChange,

            onError:
              onPlayerError,

            onAutoplayBlocked:
              onAutoplayBlocked

          }

        }
      );

};


/* READY */

function onPlayerReady(){

  playerReady =
    true;


  mainButton.disabled =
    false;


  status.textContent =
    "Ready — press Enter the Pandal.";


  renderPlaylist();

}


/* STATE */

function onStateChange(event){

  if(
    event.data ===
    YT.PlayerState.PLAYING
  ){

    userStarted =
      true;


    mainButton.textContent =
      "❚❚ PANDAL IS LIVE";


    status.textContent =
      "Garba is playing live.";


    startSegmentWatch();

  }


  else if(
    event.data ===
    YT.PlayerState.PAUSED
  ){

    mainButton.textContent =
      "▶ RESUME PANDAL";


    status.textContent =
      "Paused.";

  }


  else if(
    event.data ===
    YT.PlayerState.BUFFERING
  ){

    status.textContent =
      "Buffering Garba…";

  }


  else if(
    event.data ===
    YT.PlayerState.ENDED
  ){

    if(
      songs[activeIndex].segment
    ){

      nextTrack();

    }

    else if(
      userStarted
    ){

      nextTrack();

    }

  }

}


/* AUTOPLAY */

function onAutoplayBlocked(){

  status.textContent =
    "Browser blocked scripted playback. Press Play inside YouTube.";


  status.classList.add(
    "error"
  );

}


/* ERRORS */

function onPlayerError(event){

  const code =
    event.data;


  status.classList.add(
    "error"
  );


  if(
    code === 101 ||
    code === 150
  ){

    status.textContent =
      "This YouTube video does not allow website embedding.";

  }

  else if(
    code === 100
  ){

    status.textContent =
      "This YouTube video is unavailable or removed.";

  }

  else if(
    code === 153
  ){

    status.textContent =
      "YouTube could not verify the website origin.";

  }

  else{

    status.textContent =
      "YouTube could not play this track.";

  }

}


/* INITIAL */

renderPlaylist();

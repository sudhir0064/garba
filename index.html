<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garba Pandal | Pure Retro Festive Vibe 🥁</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        
        body { 
            /* Premium Rich Festival Aesthetic Background Loop */
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.7)), #3a0007;
            height: 100vh; 
            width: 100vw; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            align-items: center; 
            overflow: hidden; 
            padding: 40px 20px; 
        }

        /* Ambient Stage Light Glow Effect */
        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255, 69, 0, 0.25) 0%, transparent 70%);
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%);
            filter: blur(60px);
            z-index: 1;
            pointer-events: none;
        }

        /* Top Header Meta Data Layer like Deluxe Saloon */
        .top-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start; 
            width: 100%; 
            max-width: 1200px;
            z-index: 10;
        }

        .time-meta {
            color: rgba(255,255,255,0.7);
            font-size: 0.85rem;
            line-height: 1.5;
            text-align: left;
        }

        .live-counter { 
            background: rgba(255, 255, 255, 0.1); 
            backdrop-filter: blur(10px);
            color: #ffffff; 
            padding: 6px 14px; 
            border-radius: 20px; 
            font-size: 0.8rem; 
            font-weight: 600; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            border: 1px solid rgba(255, 255, 255, 0.15); 
        }
        
        .live-dot { width: 7px; height: 7px; background: #22c55e; border-radius: 50%; animation: pulse 2s infinite; }

        /* Center Big Bold Deluxe Typography Branding */
        .center-branding { margin: auto; text-align: center; z-index: 5; }
        .main-title { 
            font-size: clamp(4rem, 9vw, 6.5rem); 
            font-weight: 900; 
            color: #ffffff; 
            line-height: 1.1; 
            letter-spacing: 2px;
            text-shadow: 0 10px 40px rgba(0, 0, 0, 0.85); 
        }
        .subtitle { font-size: clamp(0.8rem, 1.5vw, 1.1rem); color: #ffd700; font-weight: 700; text-transform: uppercase; letter-spacing: 5px; margin-top: 15px; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }

        /* Deluxe Premium Floating Player Capsule (Bottom) */
        .premium-player-card {
            background: #111111;
            border-radius: 24px;
            width: 100%;
            max-width: 680px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.8);
            margin-bottom: 20px;
            z-index: 10;
            border: 1px solid rgba(255,255,255,0.08);
        }

        /* YouTube Real-Video Component Layer Frame */
        .yt-frame-holder {
            width: 180px;
            height: 100px;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            flex-shrink: 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .track-details { 
            flex-grow: 1; 
            overflow: hidden; 
            text-align: left; 
        }
        
        .song-name { font-size: 1.1rem; font-weight: 700; color: #ffffff; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .artist-name { font-size: 0.85rem; color: #aaaaaa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 12px; }

        /* Audio Interaction Layout Group */
        .controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .nav-buttons-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn-action { 
            background: none; 
            border: none; 
            color: #ffffff; 
            font-size: 1.2rem; 
            cursor: pointer; 
            opacity: 0.65; 
            transition: opacity 0.2s, transform 0.2s; 
        }
        .btn-action:hover { opacity: 1; transform: scale(1.1); }
        
        .btn-main-play { background: #ffffff; color: #000000; width: 40px; height: 40px; border-radius: 50%; font-size: 1rem; display: flex; justify-content: center; align-items: center; opacity: 1 !important; border: none; cursor: pointer; }

        .taali-stat {
            font-size: 0.85rem;
            color: #ffd700;
            background: rgba(255, 215, 0, 0.1);
            padding: 4px 12px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }
        .taali-stat:active { transform: scale(0.95); }

        @keyframes pulse { 0% { transform: scale(0.9); opacity: 0.6; } 50% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(0.9); opacity: 0.6; } }
    </style>
</head>

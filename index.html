        listenerCount +=
          Math.random() > 0.5
            ? movement
            : -movement;


        listenerCount =
          Math.max(
            1000,
            listenerCount
          );


        listeners.textContent =
          listenerCount.toLocaleString(
            "en-IN"
          )
          +
          " listening";

      },
      7000
    );



    /* =====================================
       HTML ESCAPE
    ====================================== */

    function escapeHtml(
      value
    ) {

      return String(value)

        .replaceAll(
          "&",
          "&amp;"
        )

        .replaceAll(
          "<",
          "&lt;"
        )

        .replaceAll(
          ">",
          "&gt;"
        )

        .replaceAll(
          '"',
          "&quot;"
        )

        .replaceAll(
          "'",
          "&#039;"
        );

    }



    /* =====================================
       PLAYLIST RENDER
    ====================================== */

    function renderPlaylist() {

      const visibleSongs =
        songs

          .map(
            function (
              song,
              index
            ) {

              return {
                song,
                index
              };

            }
          )

          .filter(
            function (
              item
            ) {

              return (
                activeFilter ===
                  "all"
                ||
                item.song.category ===
                  activeFilter
              );

            }
          );


      playlistCount.textContent =
        visibleSongs.length
        +
        " SONGS";


      songList.innerHTML =
        visibleSongs

          .map(
            function (
              item,
              displayIndex
            ) {

              const song =
                item.song;

              const actualIndex =
                item.index;


              const active =
                actualIndex ===
                activeIndex
                  ? " active"
                  : "";


              const icon =
                song.id
                  ? "▶"
                  : "↗";


              return `

                <button
                  class="song-item${active}"
                  data-index="${actualIndex}"
                  type="button"
                >

                  <span
                    class="song-number"
                  >
                    ${String(
                      displayIndex + 1
                    ).padStart(2,"0")}
                  </span>


                  <span
                    class="song-info"
                  >

                    <span
                      class="song-title"
                    >
                      ${escapeHtml(
                        song.title
                      )}
                    </span>


                    <span
                      class="song-artist"
                    >
                      ${escapeHtml(
                        song.artist
                      )}
                    </span>

                  </span>


                  <span
                    class="song-play"
                  >
                    ${icon}
                  </span>

                </button>

              `;

            }
          )

          .join("");

    }



    /* =====================================
       SONG INFORMATION
    ====================================== */

    function setSongInfo(
      index
    ) {

      const song =
        songs[index];


      songName.textContent =
        song.title;


      artist.textContent =
        song.artist;


      source.textContent =
        song.id
          ? "YouTube · Direct Player"
          : "YouTube · Search";


      renderPlaylist();

    }



    /* =====================================
       LOAD SELECTED SONG
    ====================================== */

    function loadSong(
      index,
      playImmediately
    ) {

      activeIndex =
        index;


      const song =
        songs[index];


      setSongInfo(
        index
      );


      status.classList.remove(
        "error"
      );


      /*
        Some songs intentionally don't have
        a guessed video ID.

        Clicking them opens exact YouTube
        search instead of breaking player.
      */

      if (!song.id) {

        status.textContent =
          "Opening exact YouTube search…";


        window.open(

          "https://www.youtube.com/results?search_query="
          +
          encodeURIComponent(
            song.search
            ||
            (
              song.title
              +
              " "
              +
              song.artist
            )
          ),

          "_blank",

          "noopener"

        );


        return;

      }


      if (!playerReady) {

        status.textContent =
          "YouTube player is still loading…";


        return;

      }


      status.textContent =
        "Loading "
        +
        song.title
        +
        "…";


      try {

        player.loadVideoById(
          song.id
        );


        if (
          playImmediately
        ) {

          userStarted =
            true;

          player.playVideo();

        }

      }

      catch (
        error
      ) {

        console.error(
          error
        );


        status.textContent =
          "Could not load this track.";


        status.classList.add(
          "error"
        );

      }

    }



    /* =====================================
       PLAYLIST CLICK
    ====================================== */

    songList.addEventListener(
      "click",
      function (
        event
      ) {

        const button =
          event.target.closest(
            ".song-item"
          );


        if (!button) {
          return;
        }


        loadSong(
          Number(
            button.dataset.index
          ),
          false
        );

      }
    );



    /* =====================================
       FILTER TABS
    ====================================== */

    document
      .querySelectorAll(
        ".tab"
      )

      .forEach(
        function (
          tab
        ) {

          tab.addEventListener(
            "click",
            function () {

              document
                .querySelectorAll(
                  ".tab"
                )

                .forEach(
                  function (
                    item
                  ) {

                    item.classList.remove(
                      "active"
                    );

                  }
                );


              tab.classList.add(
                "active"
              );


              activeFilter =
                tab.dataset.filter;


              renderPlaylist();

            }
          );

        }
      );



    /* =====================================
       LOAD YOUTUBE IFRAME API
    ====================================== */

    const youtubeScript =
      document.createElement(
        "script"
      );


    youtubeScript.src =
      "https://www.youtube.com/iframe_api";


    youtubeScript.async =
      true;


    document.head.appendChild(
      youtubeScript
    );



    /* =====================================
       YOUTUBE API READY
    ====================================== */

    window.onYouTubeIframeAPIReady =
      function () {


        player =
          new YT.Player(

            "youtube-player",

            {

              /*
                Current working song
              */

              videoId:
                songs[0].id,


              width:
                "100%",


              height:
                "100%",


              playerVars: {

                autoplay:
                  0,

                controls:
                  1,

                playsinline:
                  1,

                enablejsapi:
                  1,

                fs:
                  1,

                rel:
                  0,

                iv_load_policy:
                  3,

                origin:
                  SITE_ORIGIN

              },


              events: {

                onReady:
                  onPlayerReady,

                onStateChange:
                  onPlayerStateChange,

                onError:
                  onPlayerError,

                onAutoplayBlocked:
                  onAutoplayBlocked

              }

            }

          );

      };



    /* =====================================
       PLAYER READY
    ====================================== */

    function onPlayerReady() {

      playerReady =
        true;


      enterButton.disabled =
        false;


      status.textContent =
        "Ready — press Enter the Pandal.";


      renderPlaylist();

    }



    /* =====================================
       PLAYER STATE
    ====================================== */

    function onPlayerStateChange(
      event
    ) {


      if (
        event.data ===
        YT.PlayerState.PLAYING
      ) {

        userStarted =
          true;


        enterButton.textContent =
          "❚❚  PANDAL IS LIVE";


        status.textContent =
          "Garba is playing live.";


        return;

      }



      if (
        event.data ===
        YT.PlayerState.PAUSED
      ) {

        enterButton.textContent =
          "▶  RESUME PANDAL";


        status.textContent =
          "Paused.";


        return;

      }



      if (
        event.data ===
        YT.PlayerState.BUFFERING
      ) {

        status.textContent =
          "Buffering Garba…";


        return;

      }



      if (
        event.data ===
        YT.PlayerState.ENDED
      ) {


        /*
          Keep loop behaviour from the
          working version.
        */

        if (
          userStarted
        ) {

          player.seekTo(
            0,
            true
          );


          player.playVideo();

        }

      }

    }



    /* =====================================
       ENTER / PAUSE / RESUME
    ====================================== */

    enterButton.addEventListener(
      "click",
      function () {


        if (
          !playerReady
        ) {

          status.textContent =
            "YouTube player is still loading…";


          return;

        }


        userStarted =
          true;


        status.classList.remove(
          "error"
        );


        try {


          const state =
            player.getPlayerState();


          if (
            state ===
            YT.PlayerState.PLAYING
          ) {


            player.pauseVideo();


          }

          else {


            player.playVideo();


          }


        }

        catch (
          error
        ) {

          console.error(
            error
          );


          status.textContent =
            "Press Play inside the YouTube player.";


          status.classList.add(
            "error"
          );

        }

      }
    );



    /* =====================================
       AUTOPLAY BLOCKED
    ====================================== */

    function onAutoplayBlocked() {


      status.textContent =
        "Browser blocked scripted playback. Press Play inside YouTube.";


      status.classList.add(
        "error"
      );


      enterButton.textContent =
        "▶  PLAY INSIDE PLAYER";

    }



    /* =====================================
       YOUTUBE ERROR
    ====================================== */

    function onPlayerError(
      event
    ) {


      console.error(
        "YouTube player error:",
        event.data
      );


      if (
        event.data ===
          101
        ||
        event.data ===
          150
      ) {


        status.textContent =
          "This video does not allow website embedding.";

      }


      else if (
        event.data ===
        100
      ) {


        status.textContent =
          "This video is unavailable or removed.";

      }


      else if (
        event.data ===
        153
      ) {


        status.textContent =
          "YouTube could not verify this site's origin.";

      }


      else {


        status.textContent =
          "YouTube could not play this video.";

      }


      status.classList.add(
        "error"
      );

    }



    /* =====================================
       SPACEBAR CONTROL
    ====================================== */

    document.addEventListener(
      "keydown",
      function (
        event
      ) {


        if (
          event.code ===
          "Space"
          &&
          playerReady
        ) {


          event.preventDefault();


          const state =
            player.getPlayerState();


          if (
            state ===
            YT.PlayerState.PLAYING
          ) {


            player.pauseVideo();


          }

          else {


            userStarted =
              true;


            player.playVideo();

          }

        }

      }
    );



    /* =====================================
       FIRST RENDER
    ====================================== */

    renderPlaylist();

  </script>

</body>
</html>

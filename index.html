<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garba Pandal | Pure Retro Festive Vibe 🥁</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        
        body { 
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.7)), #3a0007;
            height: 100vh; 
            width: 100vw; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            align-items: center; 
            overflow: hidden; 
            padding: 40px 20px; 
        }

        .top-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start; 
            width: 100%; 
            max-width: 1200px;
            z-index: 10;
        }

        .time-meta { color: rgba(255,255,255,0.7); font-size: 0.85rem; line-height: 1.5; text-align: left; }
        .live-counter { background: rgba(255, 255, 255, 0.1); color: #ffffff; padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .live-dot { width: 7px; height: 7px; background: #22c55e; border-radius: 50%; }

        .center-branding { margin: auto; text-align: center; z-index: 5; }
        .main-title { font-size: clamp(4rem, 9vw, 6.5rem); font-weight: 900; color: #ffffff; line-height: 1.1; letter-spacing: 2px; }
        .subtitle { font-size: clamp(0.8rem, 1.5vw, 1.1rem); color: #ffd700; font-weight: 700; text-transform: uppercase; letter-spacing: 5px; margin-top: 15px; }

        /* Deluxe Floating Player Card */
        .premium-player-card {
            background: #111111;
            border-radius: 24px;
            width: 100%;
            max-width: 600px;
            padding: 18px 24px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.8);
            margin-bottom: 20px;
            z-index: 10;
            border: 1px solid rgba(255,255,255,0.08);
        }

        /* 100% Working Traditional Visual Disc Icon */
        .visual-disc {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff4500, #ffd700);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            box-shadow: 0 4px 15px rgba(255, 69, 0, 0.3);
            flex-shrink: 0;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .visual-disc:active { transform: scale(0.92); }
        .rotate { animation: spin 4s linear infinite; }

        .track-details { flex-grow: 1; overflow: hidden; text-align: left; }
        .song-name { font-size: 1.15rem; font-weight: 700; color: #ffffff; margin-bottom: 4px; }
        .artist-name { font-size: 0.85rem; color: #aaaaaa; margin-bottom: 12px; }

        .controls-row { display: flex; align-items: center; justify-content: space-between; width: 100%; }
        
        .btn-main-play { background: #ffffff; color: #000000; width: 42px; height: 42px; border-radius: 50%; font-size: 1.1rem; display: flex; justify-content: center; align-items: center; cursor: pointer; border: none; font-weight: bold; }
        .btn-main-play:active { transform: scale(0.95); }

        .taali-stat { font-size: 0.85rem; color: #ffd700; background: rgba(255, 215, 0, 0.1); padding: 6px 14px; border-radius: 10px; font-weight: 600; cursor: pointer; border: 1px solid rgba(255, 215, 0, 0.2); }
        
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="time-meta">
            <div id="liveTime">04:38 pm</div>
            <div style="font-size: 0.7rem; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; color: #ffd700;">Navratri Festival Mode</div>
        </div>
        <div class="live-counter"><span class="live-dot"></span><span id="liveCount">1,086</span> listening</div>
    </div>

    <div class="center-branding">
        <h1 class="main-title">गरबा<br>पंडाल</h1>
        <div class="subtitle">Deluxe United Way Loop</div>
    </div>

    <div class="premium-player-card">
        <!-- Interactive Traditional Rotating Disc -->
        <div class="visual-disc" id="clapBtn">🥁</div>

        <div class="track-details">
            <div class="song-name">Tara Vina Shyam</div>
            <div class="artist-name">Atul Purohit | United Way Vadodara</div>
            <div class="controls-row">
                <button class="btn-main-play" id="playBtn">▶</button>
                <div class="taali-stat">👏 Taalis: <span id="clapCount">0</span></div>
            </div>
        </div>
    </div>

    <!-- Secure Unblockable Public Server Audio Engine Layers -->
    <audio id="audioEngine" src="https://archive.org" preload="auto" loop></audio>
    <audio id="clapSound" src="https://mixkit.co"></audio>

    <script>
        let claps = 0;
        const audioEngine = document.getElementById('audioEngine');
        const clapSound = document.getElementById('clapSound');
        const playBtn = document.getElementById('playBtn');
        const clapBtn = document.getElementById('clapBtn');
        const clapCount = document.getElementById('clapCount');
        const liveCount = document.getElementById('liveCount');
        const liveTime = document.getElementById('liveTime');

        function playMusic() {
            audioEngine.play().then(() => {
                playBtn.textContent = "⏸";
                clapBtn.classList.add('rotate');
            }).catch(e => console.log("Tap activation required"));
        }

        function togglePlay() {
            if (audioEngine.paused) {
                playMusic();
            } else {
                audioEngine.pause();
                playBtn.textContent = "▶";
                clapBtn.classList.remove('rotate');
            }
        }

        playBtn.addEventListener('click', togglePlay);

        clapBtn.addEventListener('click', () => {
            if (audioEngine.paused) {
                playMusic();
            }
            clapSound.currentTime = 0;
            clapSound.play().catch(e => {});
            
            claps++;
            clapCount.textContent = claps;
        });

        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'pm' : 'am';
            hours = hours % 12 || 12;
            minutes = minutes < 10 ? '0'+minutes : minutes;
            liveTime.textContent = `${hours}:${minutes} ${ampm}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        setInterval(() => {
            let active = parseInt(liveCount.textContent.replace(',', ''));
            liveCount.textContent = (active + Math.floor(Math.random() * 5) - 2).toLocaleString();
        }, 3000);
    </script>
</body>
</html>
